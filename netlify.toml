[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NETLIFY = "true"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["vite", "pg-native"]

# Route API requests to the Netlify serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Fallback for Single Page Application client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
